<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><text x="74" y="52" font-size="17" fill="#C5303A" font-weight="700" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">边界</text><text x="72" y="92" font-size="38" fill="#1F2A44" font-weight="800" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">HalluSquatting 的边界 → 接我的问题</text><rect x="74" y="124" width="150" height="6" rx="3" ry="3" fill="#C5303A"/><text x="110" y="250" font-size="24" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="700">它已经打到真实 RCE（40–100%），所以我不能说“第一个测真实执行”。但：</tspan></text><text x="110" y="322" font-size="22" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   它的触发是 </tspan><tspan fill="#C5303A" font-weight="700">用户明确要求 clone / install</tspan><tspan fill="#1F2A44" font-weight="400">（用户本有获取意图，被幻觉+抢注劫持）。</tspan></text><text x="110" y="402" font-size="23" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#6B46C1" font-weight="700">→  </tspan><tspan fill="#6B46C1" font-weight="700">我测的是：用户</tspan><tspan fill="#C5303A" font-weight="700">完全没有获取意图</tspan><tspan fill="#6B46C1" font-weight="700">、只给普通任务时，agent 会不会自发装。</tspan></text><text x="110" y="456" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#6B7688" font-weight="400">      两者威胁模型不同：一个是“被劫持的显式安装”，一个是“任务诱导的自主安装”。</tspan></text><text x="70" y="872" font-size="15" fill="#AEB6C2" font-weight="400" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">组会 · Do Not Mention / SCR / HalluSquatting → 我的 idea</text><text x="1530" y="872" font-size="15" fill="#AEB6C2" font-weight="400" text-anchor="end" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">19</text></svg>