<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><text x="74" y="52" font-size="17" fill="#6B7688" font-weight="700" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">BACKUP</text><text x="72" y="92" font-size="38" fill="#1F2A44" font-weight="800" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">（备用）汇报口径红线</text><rect x="74" y="124" width="150" height="6" rx="3" ry="3" fill="#6B7688"/><text x="110" y="250" font-size="22" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="700">被追问时，守住这几条：</tspan></text><text x="110" y="300" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   • 不说“第一个测 install / E2E / 自主触发” —— SCR、HalluSquatting 已分别覆盖。</tspan></text><text x="110" y="340" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   • “26.1% 有漏洞”是另一篇的静态筛查口径，被 SCR 误引；本篇是 0.16% 行为确认。</tspan></text><text x="110" y="380" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   • 我的 0/2/1 是单模型先导观察，不是“明确任务天然安全”的普适结论。</tspan></text><text x="110" y="420" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   • 三篇百分比不能直接横比：起点、终点、成功定义都不同。</tspan></text><text x="110" y="460" font-size="19" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle"><tspan fill="#1F2A44" font-weight="400">   • research gap ≠ novelty：贡献要来自新测量/新现象/方法/防御；低装机率也要有结构才有价值。</tspan></text><text x="70" y="872" font-size="15" fill="#AEB6C2" font-weight="400" text-anchor="start" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">组会 · Do Not Mention / SCR / HalluSquatting → 我的 idea</text><text x="1530" y="872" font-size="15" fill="#AEB6C2" font-weight="400" text-anchor="end" font-family='"Alibaba PuHuiTi 3.0","Noto Sans CJK SC",sans-serif' dominant-baseline="middle">25</text></svg>