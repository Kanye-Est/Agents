<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Skill 供应链相关工作覆盖图</title>
  <desc id="desc">按 S0 能力缺口、S1 发现检索、S2 安装采纳、S3 调用载荷划分相关工作，并突出普通任务触发的自主 acquisition 空白。</desc>
  <defs>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #102A43; }
      .subtitle { font-size: 20px; fill: #486581; }
      .stage { font-size: 25px; font-weight: 700; fill: #102A43; }
      .stage-en { font-size: 16px; font-weight: 600; fill: #627D98; }
      .paper { font-size: 17px; font-weight: 650; fill: #102A43; }
      .note { font-size: 15px; fill: #486581; }
      .status { font-size: 17px; font-weight: 700; }
      .focus { font-size: 24px; font-weight: 700; fill: white; }
      .focus-small { font-size: 18px; fill: #E6FFFA; }
      .legend { font-size: 15px; fill: #334E68; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102A43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#829AB1"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7FAFC"/>
  <text x="70" y="67" class="sans title">Agent Skill 供应链：相关工作覆盖到哪里？</text>
  <text x="70" y="105" class="sans subtitle">按生命周期组织，而不是按论文年份堆叠；“install”必须拆成触发条件与执行深度。</text>

  <line x1="155" y1="151" x2="1435" y2="151" stroke="#829AB1" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="700" y="142" class="sans note">从普通任务到危害结果</text>

  <!-- S0 -->
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="340" height="440" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="70" y="175" width="340" height="92" rx="18" fill="#FEE2E2"/>
    <rect x="70" y="247" width="340" height="20" fill="#FEE2E2"/>
  </g>
  <text x="95" y="215" class="sans stage">S0 · 能力缺口</text>
  <text x="95" y="245" class="sans stage-en">CAPABILITY GAP / AUTONOMY</text>
  <text x="95" y="305" class="sans note">agent 是否自己判断：</text>
  <text x="95" y="332" class="sans paper">“现有能力不够，需要扩展”</text>
  <rect x="95" y="365" width="290" height="58" rx="12" fill="#F1F5F9"/>
  <text x="112" y="390" class="sans paper">Skills Survey</text>
  <text x="112" y="412" class="sans note">有 acquisition 架构，非安全基准</text>
  <rect x="95" y="438" width="290" height="58" rx="12" fill="#F1F5F9"/>
  <text x="112" y="463" class="sans paper">AgentSkillOS / SkillSelect</text>
  <text x="112" y="485" class="sans note">检索与编排系统，未测攻击触发</text>
  <line x1="95" y1="531" x2="385" y2="531" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="111" cy="566" r="8" fill="#DC2626"/>
  <text x="130" y="572" class="sans status" fill="#B91C1C">系统实证最薄弱</text>
  <text x="95" y="598" class="sans note">普通任务下的自主扩展意图未被量化</text>

  <!-- S1 -->
  <g filter="url(#shadow)">
    <rect x="445" y="175" width="340" height="440" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="445" y="175" width="340" height="92" rx="18" fill="#DBEAFE"/>
    <rect x="445" y="247" width="340" height="20" fill="#DBEAFE"/>
  </g>
  <text x="470" y="215" class="sans stage">S1 · 发现 / 检索</text>
  <text x="470" y="245" class="sans stage-en">DISCOVERY / RETRIEVAL</text>
  <rect x="470" y="300" width="290" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="487" y="325" class="sans paper">IPI</text>
  <text x="487" y="347" class="sans note">Vanilla≈0；优化后接近满分</text>
  <rect x="470" y="372" width="290" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="487" y="397" class="sans paper">ToolHijacker</text>
  <text x="487" y="419" class="sans note">tool library：retrieval → selection</text>
  <rect x="470" y="444" width="290" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="487" y="469" class="sans paper">Semantic Supply-chain</text>
  <text x="487" y="491" class="sans note">registry 检索胜率 86%，Top-10≈80%</text>
  <line x1="470" y1="531" x2="760" y2="531" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="486" cy="566" r="8" fill="#2563EB"/>
  <text x="505" y="572" class="sans status" fill="#1D4ED8">证据充分</text>
  <text x="470" y="598" class="sans note">“能否被看见”已有成熟攻击与指标</text>

  <!-- S2 -->
  <g filter="url(#shadow)">
    <rect x="820" y="175" width="340" height="440" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="820" y="175" width="340" height="92" rx="18" fill="#FEF3C7"/>
    <rect x="820" y="247" width="340" height="20" fill="#FEF3C7"/>
  </g>
  <text x="845" y="215" class="sans stage">S2 · 采纳 / 安装</text>
  <text x="845" y="245" class="sans stage-en">ENDORSEMENT / INSTALLATION</text>
  <rect x="845" y="290" width="290" height="70" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="862" y="315" class="sans paper">HalluSquatting</text>
  <text x="862" y="338" class="sans note">显式 install 请求；真实安装+调用/RCE</text>
  <rect x="845" y="374" width="290" height="70" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="862" y="399" class="sans paper">SearchGEO</text>
  <text x="862" y="422" class="sans note">伪证据 → 精确安装命令；未执行</text>
  <rect x="845" y="458" width="290" height="70" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="862" y="483" class="sans paper">Skills That Don’t Exist</text>
  <text x="862" y="506" class="sans note">幻觉推荐；n=1 再授权安装 PoC</text>
  <line x1="845" y1="546" x2="1135" y2="546" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="861" cy="576" r="8" fill="#F59E0B"/>
  <text x="880" y="582" class="sans status" fill="#B45309">按设定部分覆盖</text>
  <text x="845" y="606" class="sans note">显式授权与命令输出已有；自主实装未覆盖</text>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="1195" y="175" width="340" height="440" rx="18" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="1195" y="175" width="340" height="92" rx="18" fill="#D1FAE5"/>
    <rect x="1195" y="247" width="340" height="20" fill="#D1FAE5"/>
  </g>
  <text x="1220" y="215" class="sans stage">S3 · 调用 / 载荷</text>
  <text x="1220" y="245" class="sans stage-en">INVOCATION / PAYLOAD</text>
  <rect x="1220" y="300" width="290" height="58" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1237" y="325" class="sans paper">Skill-Inject · Poise</text>
  <text x="1237" y="347" class="sans note">已加载后的恶意规程与旁路载荷</text>
  <rect x="1220" y="372" width="290" height="58" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1237" y="397" class="sans paper">ToolTweak · MPMA</text>
  <text x="1237" y="419" class="sans note">同类候选中的偏好/选择操纵</text>
  <rect x="1220" y="444" width="290" height="58" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1237" y="469" class="sans paper">SkillTrojan · BadSkill</text>
  <text x="1237" y="491" class="sans note">装后后门与危害上界</text>
  <line x1="1220" y1="531" x2="1510" y2="531" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="1236" cy="566" r="8" fill="#059669"/>
  <text x="1255" y="572" class="sans status" fill="#047857">证据充分</text>
  <text x="1220" y="598" class="sans note">不再把“装后是否危险”作为主贡献</text>

  <!-- Surviving gap -->
  <rect x="70" y="661" width="1465" height="146" rx="20" fill="#0F766E" filter="url(#shadow)"/>
  <text x="105" y="706" class="sans focus">本工作应守住的空白：Task-induced Autonomous Acquisition</text>
  <text x="105" y="744" class="sans focus-small">用户只给普通任务（不说 install） → agent 识别能力缺口 → 自主检索 → 实际执行安装 → 调用 / 载荷 / task_ok</text>
  <rect x="109" y="767" width="1350" height="2" fill="#5EEAD4" opacity="0.65"/>
  <text x="105" y="794" class="sans focus-small">贡献关键词：S0 自主性　·　emitted ≠ executed　·　逐段条件概率　·　跨模型/编排器归因</text>

  <!-- Legend -->
  <circle cx="75" cy="854" r="7" fill="#2563EB"/><text x="90" y="860" class="sans legend">证据充分</text>
  <circle cx="205" cy="854" r="7" fill="#F59E0B"/><text x="220" y="860" class="sans legend">按触发/终点部分覆盖</text>
  <circle cx="430" cy="854" r="7" fill="#DC2626"/><text x="445" y="860" class="sans legend">核心实证缺口</text>
  <text x="1530" y="860" text-anchor="end" class="sans legend">Literature review update · 2026-07-16</text>
</svg>
