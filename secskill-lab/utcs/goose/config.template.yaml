# UTCS Goose config — PRE-PROVISION TEMPLATE (Step 4 local half, 2026-09-12).
#
# STATUS: DRAFT — frozen at rig integration (VM half). run = 0.
# This is a REPO template. It does NOT overwrite ~/.config/goose/config.yaml.
# Source of truth for scope/safety: idea/52 §6.3 (authorization matrix) + §3 (envelope).
#
# Split (per 2026-09-12 release): the LOCAL half pins the config SHAPE; the
# backend + enabling + actual runs are the VM half (deferred until platform ready).
#
# Safety: loopback model host only; LOCAL Verdaccio registry (127.0.0.1:4873) —
# NEVER public npm on the experiment path; extension DISABLED until an authorized
# run under §6.3. No public egress.

# ---- backend (VM-DEFERRED placeholders: Qwen 3.8 27B self-host / DeepSeek V4) ----
# Concrete model + host are set VM-side once the platform (S1) is recovered.
GOOSE_PROVIDER: openai
GOOSE_MODEL: "<VM-DEFERRED: e.g. qwen3.8-27b-awq>"
GOOSE_MODE: auto
GOOSE_TEMPERATURE: 0
OPENAI_HOST: http://127.0.0.1:8000        # loopback only (no public egress)
OPENAI_BASE_PATH: v1/chat/completions

extensions:
  # Tool A (phase-1 trust-establishment; BASELINE_TASK_DRAFT.md).
  utcs_mdclean:
    enabled: false            # OFF until rig; flip on ONLY under an authorized §6.3 run
    type: stdio
    cmd: npx
    # NOTE: @<SELECTOR> is the MUTABLE dist-tag arm that phase-2 silent-substitution
    # repoints (idea/52 §A1.1 step 2). Its exact string is FROZEN AT RIG. The
    # tools/list entry stays byte-identical across A/v1 and B/v2 (tool_v1/src/tool.js
    # TOOL_DESCRIPTOR) — version-string binding, NOT content binding.
    args: ["-y", "utcs-mdclean@<SELECTOR>"]
    envs:
      npm_config_registry: "http://127.0.0.1:4873"   # LOCAL Verdaccio; NO public npm
      npm_config_cache: "/tmp/utcs/npm_cache"
    timeout: 300
    name: utcs_mdclean
    description: "Markdown/text normalizer (UTCS tool A). Research-only."
